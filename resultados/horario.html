<html lang="es">
<head>
<meta charset="utf-8">

<title>Horario Ingeniería de Sistemas</title>
<style>

      --rojo: #ff5a5a; --baja: #183244; --noexiste: #232a33; --acento: #4cc38a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--panel); border-bottom: 3px solid var(--rojo); padding: 16px 20px; }
  h1 { margin: 0 0 4px; font-size: 20px; color: var(--rojo); }
  .sub { color: var(--suave); font-size: 13px; }
  main { padding: 16px 20px 32px; max-width: 1500px; margin: 0 auto; }
  .controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .pestanas { display: inline-flex; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
  .pestanas button { border: 0; background: var(--panel); color: var(--texto); padding: 7px 12px; cursor: pointer; font: inherit; }
  .pestanas button + button { border-left: 1px solid var(--borde); }
  .pestanas button.activa { background: var(--rojo); color: #fff; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--borde);
           background: var(--panel); color: var(--texto); min-width: 200px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .stat { background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 6px 10px; }
  .stat b { font-variant-numeric: tabular-nums; }
  .envoltura { overflow-x: auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; table-layout: fixed; }
  th, td { border: 1px solid var(--borde); vertical-align: top; }
  thead th { padding: 8px; font-size: 13px; background: var(--panel); position: sticky; top: 0; }
  tbody th { width: 74px; padding: 8px 6px; font-size: 12px; text-align: center; white-space: nowrap; }
  tbody th small { display: block; color: var(--suave); font-weight: 400; }
  td { padding: 4px; height: 64px; }
  td.baja { background: var(--baja); }
  td.noexiste { background: repeating-linear-gradient(45deg, var(--noexiste), var(--noexiste) 6px, transparent 6px, transparent 12px); }
  .bloque { border-radius: 6px; padding: 4px 6px; margin: 0 0 4px; color: #1c2430; font-size: 12px;
            border-left: 4px solid rgba(0,0,0,.25); cursor: default; }
  .bloque .c { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .compacto .bloque .c { display: inline; }
  .bloque .d { display: block; opacity: .85; font-size: 11px; }
  .bloque.fp { box-shadow: inset 0 0 0 2px #c0392b; }
  .compacto .bloque { display: inline-block; margin: 0 3px 3px 0; padding: 2px 5px; font-size: 11px; }
  .compacto .bloque .d { display: none; }
  .AULA { background: #f9e79f; } .LAB_COMPUTO { background: #aed6f1; } .LAB_ELECTRONICA { background: #f5cba7; }
  .LAB_REDES { background: #d2b4de; } .LAB_FISICA { background: #a3e4d7; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; color: var(--suave); font-size: 12px; align-items: center; }
  .leyenda span.m { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .vacio { color: var(--suave); padding: 24px; text-align: center; }
  @media print { header, .controles { display: none; } .envoltura { overflow: visible; border: 0; } }
</style>
</head>

<header>

  <div class="sub" id="resumen"></div>
</header>
<main>

    <select id="opcion" aria-label="Elemento a mostrar"></select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="envoltura"><table id="grilla"></table></div>
  <div class="leyenda" id="leyenda"></div>
</main>

ref": false}, {"grupo": "ELV-05-G1", "bloque": 2, "curso": "Minería de procesos", "semestre": 8, "profesor": "P28", "salon": "DV-LC4", "capacidad": 30, "tipo": "LAB_COMPUTO", "inscritos": 26, "franja": "MI_10", "dia": "MIERCOLES", "hora": "10:00", "fin": "12:00", "pos": 2, "baja": false, "paquetes": ["SEM8_IS", "SEM8_TEL", "SEM8_CC", "SEM9_IS", "SEM9_TEL", "SEM9_CC", "SEM10_IS", "SEM10_TEL", "SEM10_CC"], "fuera_pref": false}, {"grupo": "ELV-06-G1", "bloque": 1, "curso": "Security Engineering", "semestre": 8, "profesor": "P24", "salon": "DV-LC5", "capacidad": 25, "tipo": "LAB_COMPUTO", "inscritos": 12, "franja": "MA_10", "dia": "MARTES", "hora": "10:00", "fin": "12:00", "pos": 2, "baja": false, "paquetes": ["SEM8_IS", "SEM8_TEL", "SEM8_CC", "SEM9_IS", "SEM9_TEL", "SEM9_CC", "SEM10_IS", "SEM10_TEL", "SEM10_CC"], "fuera_pref": false}, {"grupo": "ELV-06-G1", "bloque": 2, "curso": "Security Engineering", "semestre": 8, "profesor": "P24", "salon": "DV-LC5", "capacidad": 25, "tipo": "LAB_COMPUTO", "inscritos": 12, "franja": "LU_10", "dia": "LUNES", "hora": "10:00", "fin": "12:00", "pos": 2, "baja": false, "paquetes": ["SEM8_IS", "SEM8_TEL", "SEM8_CC", "SEM9_IS", "SEM9_TEL", "SEM9_CC", "SEM10_IS", "SEM10_TEL", "SEM10_CC"], "fuera_pref": false}]};
const TIPOS = {AULA: "Aula", LAB_COMPUTO: "Lab. cómputo", LAB_ELECTRONICA: "Lab. electrónica", LAB_REDES: "Lab. redes", LAB_FISICA: "Lab. física"};
const ETIQ = {semestre: s => "Semestre " + s, paquete: k => k, profesor: p => p, salon: r => r};
let vista = "semestre";

const m = D.meta;
document.getElementById("resumen").textContent =
  `${m.equipo} · instancia ${m.instancia} · semilla ${m.seed} · P = ${m.P} · ` +
  (m.factible ? "factible (H1–H7 = 0)" : "INFACTIBLE") + " · " +
  Object.entries(m.S).map(([k, v]) => `${k}=${v}`).join("  ");

function opciones() {
  return {semestre: D.semestres, paquete: D.paquetes, profesor: D.profesores, salon: D.salones, todo: []}[vista];
}
function filtrar(v) {
  if (vista === "todo") return D.bloques;
  return D.bloques.filter(b =>
    vista === "semestre" ? b.semestre === Number(v) :
    vista === "paquete" ? b.paquetes.includes(v) :
    vista === "profesor" ? b.profesor === v : b.salon === v);
}
function huecos(bloques) {        // huecos(A) = max A − min A + 1 − |A| por día, como en el enunciado
  const porDia = {};
  bloques.forEach(b => (porDia[b.dia] = porDia[b.dia] || new Set()).add(b.pos));
  return Object.values(porDia).reduce((t, A) => {
    const p = [...A]; return t + Math.max(...p) - Math.min(...p) + 1 - p.length; }, 0);
}
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

function dibujar() {
  const sel = document.getElementById("opcion");
  const bl = filtrar(sel.value);
  const compacto = vista === "todo" || vista === "semestre" && bl.length > 30;
  const t = document.getElementById("grilla");
  t.className = compacto ? "compacto" : "";
  let h = "<thead><tr><th></th>" + D.dias.map(d => `<th>${d[1]}</th>`).join("") + "</tr></thead><tbody>";
  D.horas.forEach(([ini, fin]) => {
    h += `<tr><th>${ini}<small>${fin}</small></th>`;
    D.dias.forEach(([dia]) => {
      const clave = dia + "|" + ini;
      if (!(clave in D.franjas)) { h += '<td class="noexiste" title="Franja inexistente"></td>'; return; }
      const aqui = bl.filter(b => b.dia === dia && b.hora === ini);
      h += `<td class="${D.franjas[clave] ? "baja" : ""}">` + aqui.map(b => {
        const tip = `${b.curso} (${b.grupo}, bloque ${b.bloque})\nProfesor: ${b.profesor}` +
          `${b.fuera_pref ? " · fuera de su franja preferida (S4)" : ""}\nSalón: ${b.salon} (${TIPOS[b.tipo]}, capacidad ${b.capacidad}) · inscritos: ${b.inscritos}` +
          `\nFranja: ${b.franja} ${b.hora}–${b.fin}${b.baja ? " · baja preferencia (S6)" : ""}\nPaquetes: ${b.paquetes.join(", ")}`;
        return `<div class="bloque ${b.tipo}${b.fuera_pref ? " fp" : ""}" title="${esc(tip)}">` +
          `<span class="c">${esc(compacto ? b.grupo + "#" + b.bloque : b.curso)}</span>` +
          `<span class="d">${esc(b.grupo)}#${b.bloque} · ${esc(b.salon)} · ${esc(b.profesor)}</span></div>`;
      }).join("") + "</td>";
    });
    h += "</tr>";
  });
  t.innerHTML = h + "</tbody>";

  const st = [["Bloques", bl.length], ["Días usados", new Set(bl.map(b => b.dia)).size],
              ["En baja preferencia (S6)", bl.filter(b => b.baja).length],
              ["Fuera de preferida (S4)", bl.filter(b => b.fuera_pref).length]];
  if (vista === "paquete") st.splice(2, 0, ["Huecos de estudiantes (S1)", huecos(bl)]);
  if (vista === "profesor") st.splice(2, 0, ["Huecos del profesor (S2)", huecos(bl)]);
  if (vista === "salon") st.splice(1, 0, ["Ocupación", Math.round(100 * bl.length / Object.keys(D.franjas).length) + " %"]);
  document.getElementById("stats").innerHTML = st.map(([k, v]) => `<div class="stat">${k}: <b>${v}</b></div>`).join("");
}

function cambiarVista(v) {
  vista = v;
  document.querySelectorAll("#pestanas button").forEach(b => b.classList.toggle("activa", b.dataset.vista === v));
  const sel = document.getElementById("opcion");
  sel.innerHTML = opciones().map(o => `<option value="${esc(o)}">${esc(ETIQ[v](o))}</option>`).join("");
  sel.style.display = v === "todo" ? "none" : "";
  dibujar();
}
document.getElementById("pestanas").addEventListener("click", e => { if (e.target.dataset.vista) cambiarVista(e.target.dataset.vista); });
document.getElementById("opcion").addEventListener("change", dibujar);
document.getElementById("leyenda").innerHTML =
  Object.entries(TIPOS).map(([k, v]) => `<span><span class="m ${k}"></span>${v}</span>`).join("") +
  '<span><span class="m" style="background:var(--baja);border:1px solid var(--borde)"></span>Franja de baja preferencia</span>' +
  '<span><span class="m" style="box-shadow:inset 0 0 0 2px #c0392b"></span>Fuera de la franja preferida del profesor</span>' +
  '<span>Pase el cursor sobre un bloque para ver el detalle.</span>';
cambiarVista("semestre");
